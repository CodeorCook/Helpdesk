<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#0D9DA4"/><meta name="description" content="Hệ thống quản lý hỗ trợ khách hàng — mọi yêu cầu đều được lắng nghe."/><script>try{var m=localStorage.getItem('helpdesk-theme');document.documentElement.dataset.theme=m==='light'||m==='dark'?m:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script><style>html{background:#fff;color-scheme:light}html[data-theme=dark]{background:#15282d;color-scheme:dark}</style><title>Hệ thống quản lý hỗ trợ khách hàng</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
